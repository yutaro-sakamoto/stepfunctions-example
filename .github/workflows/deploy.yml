name: Deploy (prod)

on:
  push:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: read

# デプロイは直列で実行し、実行中のデプロイはキャンセルしない
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: cdk deploy
    needs: ci
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # OIDC の sub クレームは repo:<owner>/<repo>:environment:prod になる
    environment: prod
    permissions:
      contents: read
      id-token: write # OIDC トークンの取得に必要
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: Deploy
        run: npx cdk deploy --all --require-approval never --no-notices
