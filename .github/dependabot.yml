version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      aws-cdk:
        patterns: ["aws-cdk", "aws-cdk-lib", "constructs", "cdk-nag"]
      dev-dependencies:
        dependency-type: development
        exclude-patterns: ["aws-cdk", "cdk-nag"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
